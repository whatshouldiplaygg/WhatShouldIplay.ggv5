
  <!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎲 What Should I Play?</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- MATRIX -->
    <canvas id="matrix"></canvas>

    <!-- DEVELOPED BY -->
    <div class="developer">

        <span class="titulo">DEVELOPED BY</span>

        <span>Cosmic</span>

        <span>Pigorcx</span>

    </div>

    <!-- CONTAINER -->
    <div class="container">

        <h1>🎲 What Should I Play?</h1>

        <p>
            Cole o link do seu perfil Steam e deixe a sorte decidir
            qual será sua próxima aventura.
        </p>

        <input
            id="perfil"
            type="text"
            placeholder="https://steamcommunity.com/id/seuperfil">

        <button onclick="sortear()">
            🎲 Surpreenda-me
        </button>

        <div id="resultado"></div>

    </div>

    <!-- Biblioteca de Confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Script Principal -->
    <script src="script.js"></script>

    <!-- Efeito Matrix -->
    <script src="matrix.js"></script>

</body>

</html>
